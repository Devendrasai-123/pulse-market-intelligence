# Optional Blueprint — you can also configure the same settings in the Render dashboard.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pulse-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: BRIGHT_DATA_API_KEY
        sync: false
      - key: PRICE_COLLECTOR_ID
        value: c_mswww62b2iig1j1hcj
      - key: PRICE_SCRAPER_URL
        value: https://www.coingecko.com/en
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: meta/llama-3.1-8b-instruct
